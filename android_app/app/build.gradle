plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.autotaskrun'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.autotaskrun'
        minSdk 30
        targetSdk 35
        versionCode 15
        versionName '1.2.4'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    // Bundled Chinese model: OCR works on the phone without Google Play or a network request.
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    testImplementation 'junit:junit:4.13.2'
}
